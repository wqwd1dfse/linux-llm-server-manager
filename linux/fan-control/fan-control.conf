# Generic fan-control configuration.
# Run "sensors" and inspect /sys/class/hwmon before changing node names.
# This file is parsed as restricted KEY=value assignments, not sourced as shell.
# Use only documented keys and plain values; commands and expansions are rejected.

INTERVAL=1
GPU_HWMON_NAMES="amdgpu radeon"
BOARD_HWMON_NAMES="nct6776 nct6775 nct6779 nct6791 nct6792 nct6793 nct6795 nct6796 nct6797 nct6798 it87"

# "auto" uses hwmon labels and safe fallbacks. A concrete node such as
# temp2_input or temp3_input can be used when the board exposes no labels.
GPU_TEMP_INPUT=auto
GPU_MEMORY_TEMP_INPUT=auto
MEMORY_TEMP_OFFSET=10

GPU_PWM_NODE=pwm1
GPU_PWM_ENABLE_NODE=pwm1_enable
GPU_RPM_NODE=fan1_input
# Automatic-mode values written during daemon shutdown. AMD GPUs commonly use
# 2; supported NCT/IT87 board controllers commonly use 5. Override only after
# checking the driver's pwm*_enable documentation.
GPU_AUTO_ENABLE_VALUE=2

FAN_PWM_NODE=pwm2
FAN_PWM_ENABLE_NODE=pwm2_enable
FAN_RPM_NODE=fan2_input
BOARD_AUTO_ENABLE_VALUE=5
BOARD_AUTO_ENABLE_NODES="pwm1_enable pwm2_enable pwm3_enable"

TEMP_1=40
TEMP_2=50
TEMP_3=60
TEMP_4=70
TEMP_5=78

# PWM curves must be non-decreasing and both final safety tiers must stay 100.
GPU_PCT_1=45
GPU_PCT_2=55
GPU_PCT_3=70
GPU_PCT_4=85
GPU_PCT_5=95
GPU_PCT_6=100

FAN_PCT_1=50
FAN_PCT_2=65
FAN_PCT_3=80
FAN_PCT_4=90
FAN_PCT_5=100
FAN_PCT_6=100
